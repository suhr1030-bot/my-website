<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPO 獵頭專屬情報中控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for textareas */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
        .toast-exit { animation: slideOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-indigo-900 text-white shadow-md z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <h1 class="text-xl font-bold tracking-wide">RPO Market Intelligence</h1>
            </div>
            <div class="text-sm font-medium text-indigo-200 bg-indigo-800 px-3 py-1 rounded-full border border-indigo-700">
                專案情報中控台 v1.0
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
        
        <!-- Left Column: Input Form -->
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    快速捕捉情報
                </h2>
                
                <form id="intelForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">情報生資料 (Raw Data) *</label>
                        <textarea id="rawText" rows="4" required class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-3 text-sm placeholder-slate-400" placeholder="貼上通話紀錄、LINE 訊息或零碎筆記... (例: 聽說某廠最近缺人調薪水)"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">情報類別 *</label>
                            <select id="category" required class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-2.5 text-sm bg-white">
                                <option value="員工流向">員工流向</option>
                                <option value="轉職原因/痛點">轉職原因/痛點</option>
                                <option value="薪酬福利變動">薪酬福利變動</option>
                                <option value="建廠/擴廠消息">建廠/擴廠消息</option>
                                <option value="整體市場變動">整體市場變動</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">影響職缺 (Role)</label>
                            <input type="text" id="role" class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-2.5 text-sm placeholder-slate-400" placeholder="如: 廠務工程師, EE">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">原任職公司 (From)</label>
                            <input type="text" id="fromCompany" class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-2.5 text-sm placeholder-slate-400" placeholder="如: A廠">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">新任職/目標公司 (To)</label>
                            <input type="text" id="toCompany" class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-2.5 text-sm placeholder-slate-400" placeholder="如: B廠">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">轉職原因 / 痛點 (選項)</label>
                        <input type="text" id="turnoverReason" class="w-full rounded-lg border-slate-300 border focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors p-2.5 text-sm placeholder-slate-400" placeholder="如: 輪班太累, 無加班費, 薪資停滯">
                    </div>

                    <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition-all flex justify-center items-center">
                        新增至情報庫
                    </button>
                </form>
            </div>
            
            <!-- Quick Tips Box -->
            <div class="bg-indigo-50 rounded-xl border border-indigo-100 p-5">
                <h3 class="text-sm font-semibold text-indigo-800 mb-2">💡 獵頭小秘訣</h3>
                <p class="text-xs text-indigo-700 leading-relaxed">
                    不需在通話中整理文句，直接記錄關鍵字。送出後，可使用右側的 <strong>「智能結構化」</strong> 自動將碎念轉換為專業報告術語。
                </p>
            </div>
        </div>

        <!-- Right Column: Dashboard & Table -->
        <div class="w-full lg:w-2/3 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 flex-grow flex flex-col">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <h2 class="text-lg font-semibold text-slate-900">本週情報暫存區</h2>
                    
                    <div class="flex space-x-3">
                        <button onclick="clearAllData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-medium py-2 px-4 rounded-lg shadow-sm transition-all text-sm flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            清空本週資料
                        </button>
                        <button onclick="openReportModal()" class="bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-all text-sm flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            生成主管匯報
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="flex flex-wrap gap-3 mb-6 bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <select id="filterCategory" class="text-sm rounded-md border-slate-300 border bg-white px-3 py-1.5 focus:border-indigo-500 focus:outline-none">
                        <option value="ALL">所有類別</option>
                        <option value="員工流向">員工流向</option>
                        <option value="轉職原因/痛點">轉職原因/痛點</option>
                        <option value="薪酬福利變動">薪酬福利變動</option>
                        <option value="建廠/擴廠消息">建廠/擴廠消息</option>
                        <option value="整體市場變動">整體市場變動</option>
                    </select>
                    <input type="text" id="filterCompany" placeholder="搜尋公司..." class="text-sm rounded-md border-slate-300 border bg-white px-3 py-1.5 focus:border-indigo-500 focus:outline-none w-40">
                </div>

                <!-- Data Container (Cards Layout for better text reading) -->
                <div id="dataContainer" class="flex-grow flex flex-col gap-4 overflow-y-auto max-h-[600px] pr-2 pb-4">
                    <!-- Empty State -->
                    <div id="emptyState" class="flex flex-col items-center justify-center py-16 text-slate-400">
                        <svg class="w-16 h-16 mb-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p class="text-sm font-medium">目前尚無情報資料</p>
                        <p class="text-xs mt-1">請從左側表單輸入市場資訊</p>
                    </div>
                    <!-- Cards will be injected here by JS -->
                </div>

            </div>
        </div>
    </main>

    <!-- Report Modal -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path></svg>
                    本週市場情報匯報 (Markdown)
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 flex-grow overflow-hidden flex flex-col">
                <textarea id="markdownOutput" class="w-full flex-grow p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm font-mono text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none mb-4" readonly></textarea>
                <div class="flex justify-end space-x-3">
                    <button onclick="closeReportModal()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                        關閉
                    </button>
                    <button onclick="copyToClipboard()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm transition-colors flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        複製到剪貼簿
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        // State Management
        const STORAGE_KEY = 'rpo_intelligence_data';
        let intelligenceData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(intelligenceData));
        }

        // DOM Elements
        const form = document.getElementById('intelForm');
        const dataContainer = document.getElementById('dataContainer');
        const emptyState = document.getElementById('emptyState');
        const filterCategory = document.getElementById('filterCategory');
        const filterCompany = document.getElementById('filterCompany');
        
        // Modal Elements
        const modal = document.getElementById('reportModal');
        const modalContent = document.getElementById('modalContent');
        const markdownOutput = document.getElementById('markdownOutput');

        // Helper: Generate UUID
        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        // Helper: Show Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white flex items-center toast-enter
                ${type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600'}`;
            toast.innerHTML = `
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                ${message}
            `;
            document.getElementById('toastContainer').appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Form Submission logic
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newItem = {
                id: generateId(),
                rawText: document.getElementById('rawText').value,
                category: document.getElementById('category').value,
                fromCompany: document.getElementById('fromCompany').value || '未指名',
                toCompany: document.getElementById('toCompany').value || '未指名',
                turnoverReason: document.getElementById('turnoverReason').value || '',
                role: document.getElementById('role').value || '未指名',
                isStructured: false,
                structuredText: "",
                timestamp: new Date()
            };

            intelligenceData.push(newItem);
            saveData(); // 新增：儲存到 localStorage
            
            // Reset form
            form.reset();
            document.getElementById('category').value = "員工流向"; // reset to default
            
            showToast('情報已成功加入暫存區！');
            renderCards();
        });

        // Filter Logic
        filterCategory.addEventListener('change', renderCards);
        filterCompany.addEventListener('input', renderCards);

        // Render Cards logic
        function renderCards() {
            const catFilter = filterCategory.value;
            const compFilter = filterCompany.value.toLowerCase().trim();

            const filteredData = intelligenceData.filter(item => {
                const matchCat = catFilter === 'ALL' || item.category === catFilter;
                const matchComp = item.fromCompany.toLowerCase().includes(compFilter) || item.toCompany.toLowerCase().includes(compFilter);
                return matchCat && matchComp;
            });

            // Clear container except empty state
            const cards = dataContainer.querySelectorAll('.intel-card');
            cards.forEach(c => c.remove());

            if (filteredData.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';

            filteredData.slice().reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = `intel-card bg-white border ${item.isStructured ? 'border-indigo-200 shadow-md ring-1 ring-indigo-50' : 'border-slate-200 shadow-sm'} rounded-xl p-4 transition-all`;
                
                const categoryColors = {
                    '員工流向': 'bg-blue-100 text-blue-800',
                    '轉職原因/痛點': 'bg-rose-100 text-rose-800',
                    '薪酬福利變動': 'bg-emerald-100 text-emerald-800',
                    '建廠/擴廠消息': 'bg-amber-100 text-amber-800',
                    '整體市場變動': 'bg-slate-100 text-slate-800'
                };
                const colorClass = categoryColors[item.category] || categoryColors['整體市場變動'];

                let companyFlowHtml = `<span class="text-sm font-bold text-slate-800 flex items-center">
                    <svg class="w-4 h-4 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    ${item.fromCompany} ${item.toCompany !== '未指名' ? `<span class="text-indigo-400 mx-1">➔</span> ${item.toCompany}` : ''}
                </span>`;

                let reasonTagHtml = item.turnoverReason ? `<span class="text-xs text-rose-600 bg-rose-50 px-2 py-1 rounded border border-rose-100 flex items-center mt-2 sm:mt-0">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    痛點: ${item.turnoverReason}
                </span>` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex flex-wrap gap-2 items-center">
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-md ${colorClass}">
                                ${item.category}
                            </span>
                            ${companyFlowHtml}
                            <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded border border-slate-200">
                                💼 ${item.role}
                            </span>
                            ${reasonTagHtml}
                        </div>
                        <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-red-500 transition-colors" title="刪除">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    
                    <div class="mb-4">
                        ${item.isStructured ? 
                            `<div class="text-sm text-slate-800 leading-relaxed bg-indigo-50/50 p-3 rounded-lg border-l-4 border-indigo-500">
                                <span class="block text-xs font-semibold text-indigo-600 mb-1">AI 結構化輸出：</span>
                                ${item.structuredText}
                            </div>
                            <div class="text-xs text-slate-400 mt-2 pl-1 line-clamp-1 italic">原始：${item.rawText}</div>` 
                            : 
                            `<div class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 whitespace-pre-wrap">
                                ${item.rawText}
                            </div>`
                        }
                    </div>

                    <div class="flex justify-end">
                        <button onclick="mockAIStructure('${item.id}')" class="${item.isStructured ? 'hidden' : 'inline-flex'} items-center px-3 py-1.5 text-xs font-medium text-indigo-600 bg-indigo-50 rounded-md hover:bg-indigo-100 transition-colors border border-indigo-200">
                            <svg class="w-4 h-4 mr-1.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            智能結構化轉換
                        </button>
                    </div>
                `;
                dataContainer.appendChild(card);
            });
        }

        // Delete Item
        function deleteItem(id) {
            intelligenceData = intelligenceData.filter(item => item.id !== id);
            saveData(); // 新增：儲存到 localStorage
            renderCards();
            showToast('已刪除該筆情報', 'info');
        }

        // Mock AI Structuring function
        function mockAIStructure(id) {
            const item = intelligenceData.find(i => i.id === id);
            if (!item) return;

            // Mock processing delay via CSS changes (UX enhancement)
            showToast('AI 正在轉譯為專業術語...', 'info');
            
            setTimeout(() => {
                // Heuristic Mock logic based on category
                let result = "";
                const raw = item.rawText;
                
                switch(item.category) {
                    case '員工流向':
                        result = `【人才流出警訊】近期觀察到多位 ${item.role} 職級人才由 ${item.fromCompany} 流向 ${item.toCompany !== '未指名' ? item.toCompany : '其他競業'}。顯示對手可能正進行針對性挖角或擴大編制。`;
                        break;
                    case '轉職原因/痛點':
                        result = `【候選人核心痛點】針對 ${item.fromCompany} 的 ${item.role} 族群，主要轉職推力為「${item.turnoverReason || '制度與薪資僵化'}」。建議在招募話術中加強對應的優勢宣導。`;
                        break;
                    case '薪酬福利變動':
                        result = `【薪酬動態】經市場查證，${item.fromCompany} 針對 ${item.role} 啟動薪資結構調整，預期將提升其留才率，進而拉高整體招募難度。`;
                        break;
                    case '建廠/擴廠消息':
                        result = `【擴建產能】${item.fromCompany} 啟動新階段擴建專案。針對 ${item.role} 需求量大增，恐排擠市場現有之人才供給池。`;
                        break;
                    default:
                        result = `【市場綜合觀察】針對 ${item.role} 職系之人才供需狀況出現波動。候選人觀望心態轉強，需重新審視 Employer Branding 策略。`;
                }

                // If the user typed something explicitly about a percentage, keep it loosely.
                if (raw.includes('%')) {
                    const match = raw.match(/(\d+)%/);
                    if(match) result += ` (註：候選人透漏具體調幅約在 ${match[0]} 左右)`;
                }

                item.structuredText = result;
                item.isStructured = true;
                saveData(); // 新增：儲存到 localStorage
                
                renderCards();
                showToast('結構化轉換完成！');
            }, 800);
        }

        // Report Generation Logic
        function generateMarkdownReport() {
            if (intelligenceData.length === 0) {
                return "⚠️ 目前尚無任何情報紀錄。請先新增情報至系統中。";
            }

            const dateStr = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
            let md = `## 📊 RPO 專案市場與競業情報週報\n`;
            md += `> **報告產生日期:** ${dateStr}\n\n`;

            // Group by category
            const grouped = intelligenceData.reduce((acc, curr) => {
                if(!acc[curr.category]) acc[curr.category] = [];
                acc[curr.category].push(curr);
                return acc;
            }, {});

            md += `### 一、 主要競爭者員工流向分析 (Talent Flow)\n`;
            if (grouped['員工流向'] && grouped['員工流向'].length > 0) {
                grouped['員工流向'].forEach(item => {
                    const text = item.isStructured ? item.structuredText : item.rawText.replace(/\n/g, ' ');
                    md += `- **[${item.fromCompany} ➔ ${item.toCompany}]** (${item.role}): ${text}\n`;
                });
            } else {
                md += `- 本週無顯著流向異常。\n`;
            }

            md += `\n---\n`;
            md += `### 二、 核心轉職原因與候選人痛點 (Turnover Reasons)\n`;
            if (grouped['轉職原因/痛點'] && grouped['轉職原因/痛點'].length > 0) {
                grouped['轉職原因/痛點'].forEach(item => {
                    const text = item.isStructured ? item.structuredText : item.rawText.replace(/\n/g, ' ');
                    md += `- **[痛點: ${item.turnoverReason}]** (${item.fromCompany} - ${item.role}): ${text}\n`;
                });
            } else {
                md += `- 本週無特別紀錄轉職痛點。\n`;
            }

            md += `\n---\n`;
            md += `### 三、 整體市場變動與競業動態 (Market Dynamics)\n`;
            const otherCategories = ['薪酬福利變動', '建廠/擴廠消息', '整體市場變動'];
            let hasMarketNews = false;
            otherCategories.forEach(cat => {
                if (grouped[cat] && grouped[cat].length > 0) {
                    hasMarketNews = true;
                    md += `\n**【${cat}】**\n`;
                    grouped[cat].forEach(item => {
                        const text = item.isStructured ? item.structuredText : item.rawText.replace(/\n/g, ' ');
                        md += `- **${item.fromCompany}** (${item.role}): ${text}\n`;
                    });
                }
            });
            if(!hasMarketNews) md += `- 本週無其他重大市場異動。\n`;

            md += `\n---\n`;
            md += `### 四、 RPO 招募策略建議 (Action Plan)\n`;
            md += `_（基於本週競爭者動態與候選人痛點，提出以下建議：）_\n`;
            
            // Dynamic suggestions based on data
            if (grouped['轉職原因/痛點']) {
                md += `- **強打痛點解方:** 建議在後續的 Job Posting 與 First Call 中，明確針對競業候選人的痛點進行話術轉換，強調本專案優勢。\n`;
            }
            if (grouped['員工流向']) {
                md += `- **精準挖角策略:** 針對近期人才大幅流出的企業，可加強 LinkedIn 關鍵字搜尋，鎖定該企業該職能的人才進行批次開發。\n`;
            }
            if (!grouped['轉職原因/痛點'] && !grouped['員工流向']) {
                md += `- **持續優化流程:** 建議客戶端持續縮短履歷審核與面試流程 (TAT)，保持招募彈性。\n`;
                md += `- **主動出擊:** 持續觀測競爭對手動態，建立人才庫備位。\n`;
            }

            return md;
        }

        // Modal Controls
        function openReportModal() {
            markdownOutput.value = generateMarkdownReport();
            
            modal.classList.remove('hidden');
            // Trigger reflow for transition
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden'; // prevent background scrolling
        }

        function closeReportModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // Message Box logic for Clipboard copy
        function createMessageBox(msg) {
            const box = document.createElement('div');
            box.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl z-[60] flex items-center font-medium animate-bounce';
            box.innerHTML = `
                <svg class="w-6 h-6 text-emerald-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                ${msg}
            `;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 2000);
        }

        // Copy to clipboard fallback (iframe safe)
        function copyToClipboard() {
            markdownOutput.select();
            markdownOutput.setSelectionRange(0, 99999); // For mobile devices

            try {
                // Using standard execCommand as it's more reliable inside varied iframe environments
                document.execCommand('copy');
                createMessageBox('✅ Markdown 報告已複製到剪貼簿！');
            } catch (err) {
                console.error('Failed to copy text: ', err);
                createMessageBox('複製失敗，請手動全選複製。');
            }
            
            // Remove selection
            window.getSelection().removeAllRanges();
        }

        // Clear All Data Function
        function clearAllData() {
            intelligenceData = [];
            saveData();
            renderCards();
            showToast('已清空本週所有情報資料！', 'info');
        }

        // Initialize empty state
        renderCards();

    </script>
</body>
</html>
